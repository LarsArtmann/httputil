name: Release

on:
  push:
    tags:
      - "v*"
      - "server_timing/v*"

permissions:
  contents: write

env:
  # golangci-lint v2.14.0 is built with go1.27.0 and lints current 1.27.x
  # stdlib export data (verified 2026-10-09 under a go1.27.2 toolchain),
  # so no exact Go patch pin is needed. The workflow file is frozen at the
  # tag: before tagging, confirm the pinned golangci version still reads
  # the current Go patch's export data (RELEASE.md gate 6.6) — bump them
  # together if a patch outpaces it again.
  GO_VERSION: "1.27.x"
  GOLANGCI_LINT_VERSION: v2.14.0
  # setup-go's manifest lags new Go patches; pin the toolchain via Go
  # itself so govulncheck scans a stdlib with current security fixes.
  GOTOOLCHAIN: go1.27.1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet (root module)
        run: go vet ./...

      # Single-publisher design: this workflow re-runs EVERY CI gate on the
      # exact tag commit before publishing, so a tag cut from red code (or
      # from a commit that never went through CI) cannot release silently.
      - name: CHANGELOG link check
        run: ./scripts/check-changelog-links.sh

      - name: Doc snippet symbol check
        run: go run ./scripts/doc-snippet-refs README.md docs/integrations/*.md

      - name: Module boundary check (GOWORK=off per module)
        run: ./scripts/check-module-boundaries.sh

      - name: Test
        run: go test -v -race ./...

      - name: server_timing sub-module gates (build, vet, test)
        run: |
          cd server_timing
          go build ./...
          go vet ./...
          go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Run govulncheck (root module)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run govulncheck (server_timing sub-module)
        run: |
          cd server_timing
          govulncheck ./...

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
