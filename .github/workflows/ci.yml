name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # The root package imports encoding/json/v2 (2026-08-16 migration),
      # which is experiment-gated: without this flag every go build/test fails
      # with "build constraints exclude all Go files".
      GOEXPERIMENT: jsonv2
      # setup-go's manifest lags new Go patches; pin the toolchain via Go
      # itself so govulncheck scans a stdlib with current security fixes.
      GOTOOLCHAIN: go1.26.7
    strategy:
      matrix:
        go-version: ["1.26.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: CHANGELOG link check
        run: ./scripts/check-changelog-links.sh

      - name: Doc snippet symbol check
        run: go run ./scripts/doc-snippet-refs README.md docs/integrations/*.md

      - name: Module boundary check (GOWORK=off per module)
        run: ./scripts/check-module-boundaries.sh

      - name: Test
        run: go test -race -count=1 ./...

      - name: Race stress test
        run: go test -race -count=10 ./...

      - name: Test with coverage (library packages; scripts/ dev tooling excluded)
        run: go test $(go list ./... | grep -v scripts/coverage-threshold) -coverprofile=coverage.out

      - name: Coverage threshold check
        run: go tool cover -func=coverage.out | go run ./scripts/coverage-threshold 95

      - name: Update coverage badge
        run: ./scripts/update-coverage-badge.sh coverage.out README.md

      - name: Benchmark
        run: |
          set -o pipefail
          go test -bench=. -benchmem -count=1 -run='^$' ./... 2>&1 | tee bench.txt

      - name: Run govulncheck (root module)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run govulncheck (server_timing sub-module)
        run: |
          cd server_timing
          govulncheck ./...

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench
          path: bench.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2
          args: --timeout=5m

      # A .golangci.yml edit once shipped 13 findings because CI's older
      # binary silently ignored the new linter keys. Config schema + both
      # modules must pass with the same pinned binary the action uses —
      # server_timing is a separate Go module the action does not visit.
      - name: Verify golangci config schema (root + server_timing)
        run: |
          golangci-lint config verify
          cd server_timing && golangci-lint config verify

      - name: Lint (server_timing sub-module)
        run: |
          cd server_timing
          golangci-lint run ./...

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check conventional commit prefixes
        run: ./scripts/check-commit-lint.sh "origin/${{ github.base_ref }}" "origin/${{ github.head_ref }}"
