name: Nightly Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (long run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"

      - name: Fuzz decompression invariants
        run: go test -run='^$' -fuzz FuzzDecompression -fuzztime 300s .

      - name: Fuzz decompression round-trip
        run: go test -run='^$' -fuzz FuzzDecompressionInvariants -fuzztime 300s .

      - name: Fuzz CSRF token validation
        run: go test -run='^$' -fuzz FuzzCSRFMiddleware_TokenValidation -fuzztime 300s .

      - name: Fuzz CSRF origin headers
        run: go test -run='^$' -fuzz FuzzCSRFMiddleware_OriginHeaders -fuzztime 300s .

      - name: Fuzz response recorder
        run: go test -run='^$' -fuzz FuzzResponseRecorder -fuzztime 300s .

      - name: Fuzz limited reader (bomb boundary)
        run: go test -run='^$' -fuzz FuzzLimitedReadCloser -fuzztime 300s .

      - name: Fuzz nonce
        run: go test -run='^$' -fuzz FuzzNonce -fuzztime 300s .

      - name: Fuzz compression round-trip
        run: go test -run='^$' -fuzz FuzzCompression -fuzztime 300s .

      - name: Fuzz compress writer state machine
        run: go test -run='^$' -fuzz FuzzCompressWriterState -fuzztime 300s .

      - name: Fuzz CORS header building
        run: go test -run='^$' -fuzz FuzzCORS -fuzztime 300s .

      - name: Fuzz CORS origin matching
        run: go test -run='^$' -fuzz FuzzCORSOriginMatching -fuzztime 300s .

      - name: Fuzz CORS wildcard patterns
        run: go test -run='^$' -fuzz FuzzCORSWildcardPattern -fuzztime 300s .

      - name: Fuzz client IP extraction
        run: go test -run='^$' -fuzz FuzzClientIP -fuzztime 300s .

      - name: Fuzz request ID handling
        run: go test -run='^$' -fuzz FuzzRequestID -fuzztime 300s .

      - name: Fuzz query param parsing
        run: go test -run='^$' -fuzz FuzzParseUintQuery -fuzztime 300s .

      - name: Fuzz eviction TTL
        run: go test -run='^$' -fuzz FuzzEvictionTTL -fuzztime 300s .

      - name: Fuzz health response encoding
        run: go test -run='^$' -fuzz FuzzHealthResponse_Encoding -fuzztime 300s .

      - name: Fuzz CSRF isTrustedProxy
        run: go test -run='^$' -fuzz FuzzCSRFIsTrustedProxy -fuzztime 300s .

      - name: Fuzz CSRF remote host and IP
        run: go test -run='^$' -fuzz FuzzCSRFRemoteHostAndIP -fuzztime 300s .

      - name: Fuzz CSRF TrustedOrigins parsing
        run: go test -run='^$' -fuzz FuzzCSRFConfig_TrustedOrigins -fuzztime 300s .

      - name: Fuzz CSRF TrustedProxiesCIDR parsing
        run: go test -run='^$' -fuzz FuzzCSRFConfig_TrustedProxiesCIDR -fuzztime 300s .

      - name: Fuzz Server-Timing header value
        run: go test -run='^$' -fuzz FuzzServerTimingHeaderValue -fuzztime 300s ./server_timing

      - name: Fuzz Server-Timing CRLF injection
        run: go test -run='^$' -fuzz FuzzServerTimingMiddleware -fuzztime 300s ./server_timing
