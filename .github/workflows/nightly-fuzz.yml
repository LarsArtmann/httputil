name: Nightly Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Fuzz (long run)
    runs-on: ubuntu-latest
    env:
      # go.work requires >= 1.27; pin the exact toolchain like ci.yml does,
      # so the nightly can never fall behind the workspace floor (the
      # 2026-10-05..10-09 "crash" streak was exactly this: go 1.26.8 +
      # GOTOOLCHAIN=local rejected go.work before any fuzzing ran).
      GOTOOLCHAIN: go1.27.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: Fuzz decompression invariants
        run: go test -run='^$' -fuzz '^FuzzDecompression$' -fuzztime 300s .

      - name: Fuzz decompression round-trip
        run: go test -run='^$' -fuzz '^FuzzDecompressionInvariants$' -fuzztime 300s .

      - name: Fuzz CSRF token validation
        run: go test -run='^$' -fuzz '^FuzzCSRFMiddleware_TokenValidation$' -fuzztime 300s .

      - name: Fuzz CSRF origin headers
        run: go test -run='^$' -fuzz '^FuzzCSRFMiddleware_OriginHeaders$' -fuzztime 300s .

      - name: Fuzz response recorder
        run: go test -run='^$' -fuzz '^FuzzResponseRecorder$' -fuzztime 300s .

      - name: Fuzz limited reader (bomb boundary)
        run: go test -run='^$' -fuzz '^FuzzLimitedReadCloser$' -fuzztime 300s .

      - name: Fuzz nonce
        run: go test -run='^$' -fuzz '^FuzzNonce$' -fuzztime 300s .

      - name: Fuzz compression round-trip
        run: go test -run='^$' -fuzz '^FuzzCompression$' -fuzztime 300s .

      - name: Fuzz compress writer state machine
        run: go test -run='^$' -fuzz '^FuzzCompressWriterState$' -fuzztime 300s .

      - name: Fuzz CORS header building
        run: go test -run='^$' -fuzz '^FuzzCORS$' -fuzztime 300s .

      - name: Fuzz CORS origin matching
        run: go test -run='^$' -fuzz '^FuzzCORSOriginMatching$' -fuzztime 300s .

      - name: Fuzz CORS wildcard patterns
        run: go test -run='^$' -fuzz '^FuzzCORSWildcardPattern$' -fuzztime 300s .

      - name: Fuzz client IP extraction
        run: go test -run='^$' -fuzz '^FuzzClientIP$' -fuzztime 300s .

      - name: Fuzz request ID handling
        run: go test -run='^$' -fuzz '^FuzzRequestID$' -fuzztime 300s .

      - name: Fuzz query param parsing
        run: go test -run='^$' -fuzz '^FuzzParseUintQuery$' -fuzztime 300s .

      - name: Fuzz health response encoding
        run: go test -run='^$' -fuzz '^FuzzHealthResponse_Encoding$' -fuzztime 300s .

      - name: Fuzz CSRF isTrustedProxy
        run: go test -run='^$' -fuzz '^FuzzCSRFIsTrustedProxy$' -fuzztime 300s .

      - name: Fuzz CSRF remote host and IP
        run: go test -run='^$' -fuzz '^FuzzCSRFRemoteHostAndIP$' -fuzztime 300s .

      - name: Fuzz CSRF TrustedOrigins parsing
        run: go test -run='^$' -fuzz '^FuzzCSRFConfig_TrustedOrigins$' -fuzztime 300s .

      - name: Fuzz CSRF TrustedProxiesCIDR parsing
        run: go test -run='^$' -fuzz '^FuzzCSRFConfig_TrustedProxiesCIDR$' -fuzztime 300s .

      - name: Fuzz Server-Timing header value
        run: go test -run='^$' -fuzz '^FuzzServerTimingHeaderValue$' -fuzztime 300s ./server_timing

      - name: Fuzz Server-Timing CRLF injection
        run: go test -run='^$' -fuzz '^FuzzServerTimingMiddleware$' -fuzztime 300s ./server_timing

      - name: Fuzz MaxBodySize contract
        run: go test -run='^$' -fuzz '^FuzzMaxBodySize$' -fuzztime 300s .

      - name: Fuzz CORS origin echo
        run: go test -run='^$' -fuzz '^FuzzCORSOriginEcho$' -fuzztime 300s .

      - name: Fuzz negotiator wire format
        run: go test -run='^$' -fuzz '^FuzzNegotiatorWireFormat$' -fuzztime 300s .

      # Rolling-issue policy (owner decision 2026-10-09): ONE open issue
      # tracks the currently-failing nightly; a green run auto-closes it.
      # The previous per-night filer filed 27 issues in 24 days holding
      # zero real production bugs — every real failure was a re-report of
      # an already-fixed class. The failing targets are derived from the
      # new corpus files a crashing target leaves under testdata/fuzz/
      # (infra failures write none, which is itself the signature).
      - name: Roll up fuzz result (rolling issue)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eu
          gh label create nightly-fuzz --description "Rolling nightly-fuzz failure tracker" --color d73a4a 2>/dev/null || true
          if [ "$JOB_STATUS" = "success" ]; then
            for n in $(gh issue list --label nightly-fuzz --state open --json number --jq '.[].number'); do
              gh issue close "$n" --reason completed \
                --comment "Closed automatically: tonight's nightly-fuzz run is green. ${RUN_URL}" \
                || echo "::warning::failed to close issue #${n}"
            done
            exit 0
          fi
          targets=$(git status --porcelain --untracked-files=all -- '*testdata/fuzz/*' \
            | awk '{print $NF}' | sed -E 's#.*/testdata/fuzz/([^/]+)/.*#\1#' | sort -u)
          if [ -n "$targets" ]; then
            body="Failing target(s): $(echo "$targets" | tr '\n' ' ')(new corpus files under testdata/fuzz/ — root cause lives in the run log). Run: ${RUN_URL}"
          else
            body="Nightly failed with no new corpus files — likely infra, not a fuzz find. Run: ${RUN_URL}"
          fi
          n=$(gh issue list --label nightly-fuzz --state open --json number --jq 'first(.[].number)')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body" || echo "::warning::failed to comment on issue #${n}"
          else
            gh issue create --title "nightly fuzz: open failure" --body "$body" --label nightly-fuzz \
              || echo "::warning::issue creation failed; see run log"
          fi
